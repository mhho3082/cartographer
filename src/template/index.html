<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cartographer Report</title>
    <!-- https://stackoverflow.com/a/79493222 -->
    <script type="importmap">
      {
        "imports": {
          "sigma": "https://cdn.jsdelivr.net/npm/sigma@3.0.2/dist/sigma.min.js",
          "graphology": "https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js",
          "graphologyLibrary": "https://cdn.jsdelivr.net/npm/graphology-library/dist/graphology-library.min.js",
          "chroma-js": "https://cdn.jsdelivr.net/npm/chroma-js@3.2/index.min.js"
        }
      }
    </script>
    <link rel="stylesheet" href="./normalize.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="sigma-container" class="sigma-container"></div>
    <div id="sidebar-left" class="sidebar sidebar--left" data-hidden="true">
      <div id="sidebar-content-left" class="sidebar__content">
        <button
          id="sidebar-toggle-left"
          class="sidebar__toggle sidebar__toggle--left"
          aria-label="Toggle sidebar"
          aria-expanded="false"
        ></button>
        <div class="search">
          <input
            type="text"
            id="search-input"
            class="search__input"
            placeholder="Try searching titles or URLs..."
          />
          <button
            type="button"
            id="search-clear"
            class="search__clear"
            aria-label="Clear search"
            data-hidden="true"
          ></button>
        </div>
        <div id="search-suggestions" class="search-suggestions" aria-live="polite"></div>
        <select id="interactive-select">
          <option disabled>Interact with:</option>
          <option value="all" selected>All nodes</option>
          <option value="coloured">Coloured nodes only</option>
        </select>
        <select id="neighbours-select">
          <option disabled>Show neighbours on hover / click:</option>
          <option value="all" selected>All neighbours</option>
          <option value="in">Incoming only</option>
          <option value="out">Outgoing only</option>
          <option value="none">None</option>
        </select>
        <select id="grey-hide-select">
          <option disabled>For non-coloured nodes:</option>
          <option value="grey">Grey out</option>
          <option value="hide">Hide</option>
        </select>
      </div>
    </div>
    <div id="sidebar-right" class="sidebar sidebar--right" data-hidden="true">
      <div id="sidebar-content-right" class="sidebar__content"></div>
    </div>
    <div id="loading" class="loading">Loading...</div>

    <!-- Import the webcheck results -->
    <script src="./result.js"></script>

    <!-- The sigma-js config -->
    <script type="module">
      import * as sigma from "sigma";
      import "graphology";
      import "graphologyLibrary";
      import chroma from "chroma-js";

      // Based on:
      // - https://www.sigmajs.org/storybook/?path=/story/use-reducers--story
      // - https://stackoverflow.com/a/79493222

      // =======================
      // DOM helpers
      // =======================
      const $ = (id) => {
        const el = document.getElementById(id);
        if (!el) {
          throw new Error(`Missing element: #${id}`);
        }
        return el;
      };

      // DOM elements
      const container = $("sigma-container");
      const loading = $("loading");

      // Left sidebar elements
      const sidebarLeft = $("sidebar-left");
      const sidebarToggleLeft = $("sidebar-toggle-left");
      const searchInput = $("search-input");
      const searchClear = $("search-clear");
      const interactiveSelect = $("interactive-select");
      const neighboursSelect = $("neighbours-select");
      const greyHideSelect = $("grey-hide-select");

      // Right sidebar elements
      const sidebarRight = $("sidebar-right");
      const sidebarContentRight = $("sidebar-content-right");

      // =======================
      // UI state
      // =======================
      const config = {
        interactive: "all", // "coloured" | "all"
        neighbours: "all", // "in" | "out" | "all" | "none"
        greyHide: "grey", // "grey" | "hide"
      };

      const state = {
        // Search
        searchQuery: "",
        suggestions: undefined, // Set<nodeId> | undefined

        // Hover
        hoveredNode: undefined,
        hoveredNeighbours: undefined, // Set<nodeId> | undefined

        // Click
        clickedNode: undefined,
        clickedNeighbours: undefined, // Set<nodeId> | undefined
      };

      // =======================
      // Graph building
      // =======================
      const graph = new graphology.Graph();

      /**
       * Builds nodes from the result object, with URL as id.
       */
      function addNodesFromResult(result) {
        for (const [url, attributes] of Object.entries(result)) {
          let label = attributes.title;
          if (!label) {
            // If the last segment of the URL looks like a file (contains a dot),
            // use it as label, otherwise use the full URL
            const lastSegment = url.split("/").filter(Boolean).slice(-1)[0];
            label = lastSegment.includes(".") ? lastSegment : url;
          }
          graph.addNode(url, {
            ...attributes,
            label,
            x: Math.random(),
            y: Math.random(),
            size: 10,
            color: "#ccc",
          });
        }
      }

      /**
       * Add edges based on `links`, and compute backlinks.
       */
      function addEdgesAndBacklinks() {
        graph.forEachNode((sourceNode, sourceAttrs) => {
          const links = sourceAttrs.links || [];
          for (const targetNode of links) {
            if (!graph.hasNode(targetNode)) {
              continue;
            }
            if (graph.hasEdge(sourceNode, targetNode)) {
              continue;
            }

            graph.addEdge(sourceNode, targetNode);

            const backlinks =
              graph.getNodeAttribute(targetNode, "backlinks") || [];
            backlinks.push(sourceAttrs.url);
            graph.setNodeAttribute(targetNode, "backlinks", backlinks);
          }
        });
      }

      function computeScores() {
        const scores = new Map();
        graph.forEachNode((node) => {
          const score =
            graph.outNeighbors(node).length * graph.inNeighbors(node).length;
          scores.set(node, score);
        });
        return scores;
      }

      function applyNodeColors() {
        const scores = computeScores();
        const scoreValues = [...scores.values()];
        const min = Math.min(...scoreValues);
        const max = Math.max(...scoreValues);

        const colorScale = chroma
          // See https://gka.github.io/palettes to try out palettes
          .scale(["#ffffe0", "#00429d"])
          .domain([min, max]);

        graph.forEachNode((node, attrs) => {
          let color;

          if (attrs.bad) {
            color = "#ff6961"; // pastel red for bad nodes
          } else if (attrs.status >= 300 && attrs.status < 400) {
            color = "#cba3d6"; // pastel purple for redirects
          } else if (attrs.linkType === "external") {
            color = "#77dd77"; // pastel green for external links
          } else {
            color = colorScale(scores.get(node)).hex();
          }

          graph.setNodeAttribute(node, "color", color);
        });
      }

      function runLayout() {
        const settings =
          graphologyLibrary.layoutForceAtlas2.inferSettings(graph);
        graphologyLibrary.layoutForceAtlas2.assign(graph, {
          iterations: 50,
          settings,
        });
      }

      // Build graph
      addNodesFromResult(window.__RESULT__ || {});
      addEdgesAndBacklinks();
      applyNodeColors();
      runLayout();

      // Instantiate sigma.js
      const renderer = new Sigma(graph, container, { labelFont: "Figtree" });

      // =======================
      // UI helpers
      // =======================
      function setLeftSidebarHidden(hidden) {
        sidebarLeft.dataset.hidden = hidden ? "true" : "false";
        sidebarToggleLeft.setAttribute(
          "aria-expanded",
          hidden ? "false" : "true",
        );
      }

      function setRightSidebarNode(node) {
        if (!node) {
          sidebarContentRight.innerHTML = "";
          sidebarRight.dataset.hidden = "true";
          return;
        }

        const label = graph.getNodeAttribute(node, "label");
        const url = graph.getNodeAttribute(node, "url");
        const attrs = structuredClone(graph.getNodeAttributes(node));
        // Remove sigma.js internal attributes
        ["x", "y", "size", "color", "hidden", "label"].forEach(
          (k) => delete attrs[k],
        );

        // Rename keys
        const data = structuredClone(attrs);
        for (const [k, v] of Object.entries(data)) {
          let formattedKey = k
            .replace(/([a-z])([A-Z])/g, "$1 $2") // camelCase to separate words
            .replace(/(\b\w)/g, (match) => match.toUpperCase()) // capitalize words
            .replace(/url/i, "URL"); // specific formatting for URL
          data[formattedKey] = v;
          delete data[k];
        }

        sidebarContentRight.innerHTML = `
          <h2 class="sidebar__table-title"><a href="${url}" target="_blank">${label}</a></h2>
          <table class="sidebar__table">
            ${Object.entries(data)
              .map(
                ([k, v]) =>
                  `<tr>
                  <td class="sidebar__table-key">${k}</td>
                  <td>${
                    Array.isArray(v)
                      ? `<details>
                          <summary><i>${v.length} items</i></summary>
                          <ul>
                            ${v
                              .map(
                                (item) =>
                                  `<li><div class="code-block">${item}</div></li>`,
                              )
                              .join("")}
                          </ul>
                        </details>`
                      : `<div class="code-block">${v}</div>`
                  }</td>
                </tr>`,
              )
              .join("")}
          </table>
          <div class="copy-json-label">Copy JSON: <button class="copy-button"></button></div>
        `;

        sidebarContentRight.querySelectorAll(".code-block").forEach((block) => {
          const content = block.textContent;
          block.innerHTML = `<span>${content}</span>`;
          const copyButton = document.createElement("button");
          copyButton.className = "copy-button";
          block.appendChild(copyButton);
          copyButton.addEventListener("click", () => {
            navigator.clipboard.writeText(content).then(() => {
              copyButton.classList.add("copied");
              setTimeout(() => copyButton.classList.remove("copied"), 1000);
            });
          });
        });

        sidebarContentRight
          .querySelectorAll(".copy-json-label .copy-button")
          .forEach((button) => {
            button.addEventListener("click", () => {
              const content = JSON.stringify(attrs, null, 2);
              navigator.clipboard.writeText(content).then(() => {
                button.classList.add("copied");
                setTimeout(() => button.classList.remove("copied"), 1000);
              });
            });
          });

        sidebarRight.dataset.hidden = "false";
      }

      function refresh({ skipIndexation = true } = {}) {
        renderer.refresh({ skipIndexation });
      }

      function getNodeNeighbours(node) {
        switch (config.neighbours) {
          case "in":
            return new Set(graph.inNeighbors(node));
          case "out":
            return new Set(graph.outNeighbors(node));
          case "all":
            return new Set(graph.neighbors(node));
          default:
            return undefined;
        }
      }

      function setHoveredNode(node) {
        state.hoveredNode = node;
        state.hoveredNeighbours = node ? getNodeNeighbours(node) : undefined;
        refresh();
        setRightSidebarNode(state.clickedNode || state.hoveredNode);
      }

      function setClickedNode(node) {
        state.clickedNode = node;
        state.clickedNeighbours = node ? getNodeNeighbours(node) : undefined;
        refresh();
        setRightSidebarNode(state.clickedNode || state.hoveredNode);
      }

      function hasAnySelection() {
        return (
          (config.neighbours !== "none" &&
            (!!state.hoveredNode || !!state.clickedNode)) ||
          !!state.suggestions
        );
      }

      function nodeIsRelevant(node) {
        return (
          state.hoveredNode === node ||
          state.hoveredNeighbours?.has(node) ||
          state.clickedNode === node ||
          state.clickedNeighbours?.has(node) ||
          state.suggestions?.has(node)
        );
      }

      function nodeIsInteractive(node) {
        return (
          config.interactive === "all" ||
          !hasAnySelection() ||
          nodeIsRelevant(node)
        );
      }

      function greyOrHideEntity(res) {
        if (config.greyHide === "grey") {
          res.label = "";
          res.color = "#f6f6f6";
        } else if (config.greyHide === "hide") {
          res.hidden = true;
        }
      }

      function centerCameraOnNode(node) {
        const nodePosition = renderer.getNodeDisplayData(node);
        if (!nodePosition) {
          return;
        }
        renderer.getCamera().animate(nodePosition, { duration: 500 });
      }

      // =======================
      // Search (advanced multi-field search engine)
      // =======================
      class SearchEngine {
        constructor(items, options = {}) {
          this.items = items || [];
          // default fields to search when no field is specified
          this.defaultFields = options.defaultFields || [
            "title",
            "label",
            "url",
            "desc",
            "description",
          ];
        }

        // Tokenize the query respecting quoted phrases (supports escaped quotes and backslashes)
        // Also supports field:value where the value can be quoted (e.g. title:"Hello World").
        // Note: a fully-quoted token like "a:b" remains quoted and will NOT be treated as a field search.
        tokenize(query) {
          const tokens = [];
          let i = 0;
          const N = query.length;
          while (i < N) {
            while (i < N && /\s/.test(query[i])) i++;
            if (i >= N) break;

            if (query[i] === '"') {
              // Entire token is a quoted phrase: keep as quoted so we don't treat it as field:value
              i++;
              let buf = "";
              while (i < N) {
                if (query[i] === '\\' && i + 1 < N) {
                  buf += query[i + 1];
                  i += 2;
                } else if (query[i] === '"') {
                  i++;
                  break;
                } else {
                  buf += query[i];
                  i++;
                }
              }
              tokens.push({ text: buf, quoted: true });
              continue;
            }

            // Unquoted token: detect field: "quoted value" pattern and capture the quoted value as part
            let start = i;
            let pushed = false;
            while (i < N && !/\s/.test(query[i])) {
              if (query[i] === ':' && i + 1 < N && query[i + 1] === '"') {
                // field name is query.slice(start, i)
                const field = query.slice(start, i);
                i += 2; // skip :"
                let buf = "";
                while (i < N) {
                  if (query[i] === '\\' && i + 1 < N) {
                    buf += query[i + 1];
                    i += 2;
                  } else if (query[i] === '"') {
                    i++;
                    break;
                  } else {
                    buf += query[i];
                    i++;
                  }
                }
                // push a single unquoted token with value unquoted (so later split on ':' works)
                tokens.push({ text: `${field}:${buf}`, quoted: false });
                pushed = true;
                break;
              }
              i++;
            }

            if (!pushed) {
              // Normal unquoted token
              tokens.push({ text: query.slice(start, i), quoted: false });
            }
          }

          return tokens
            .map((t) => ({ ...t, text: t.text.trim() }))
            .filter((t) => t.text.length > 0);
        }

        // Helper to get values for a field from an item (array or scalar)
        getValues(item, field) {
          if (!item) return [""];
          const v = item[field];
          if (v === undefined || v === null) return [""];
          if (Array.isArray(v)) return v.map((x) => String(x));
          return [String(v)];
        }

        // Main filter: returns matched items (AND across tokens)
        filter(query) {
          if (!query || !query.trim()) return this.items.slice();

          const tokens = this.tokenize(query);

          return this.items.filter((item) => {
            return tokens.every((tok) => {
              // If token was quoted, do NOT split field:value inside it
              const raw = tok.text;
              let field = null;
              let value = raw;

              if (!tok.quoted && raw.includes(":")) {
                const idx = raw.indexOf(":");
                field = raw.slice(0, idx);
                value = raw.slice(idx + 1);
              }

              const fieldsToCheck = field ? [field] : this.defaultFields;

              // Numeric comparison? formats like >10, <=3.5, etc.
              const cmp = value.match(/^(<=|>=|<|>)(-?\d+(?:\.\d+)?)$/);
              if (cmp) {
                const op = cmp[1];
                const num = parseFloat(cmp[2]);
                return fieldsToCheck.some((f) =>
                  this.getValues(item, f).some((val) => {
                    const n = parseFloat(String(val).replace(/[^0-9\-\.]+/g, ""));
                    if (Number.isNaN(n)) return false;
                    switch (op) {
                      case "<":
                        return n < num;
                      case ">":
                        return n > num;
                      case "<=":
                        return n <= num;
                      case ">=":
                        return n >= num;
                      default:
                        return false;
                    }
                  }),
                );
              }

              // Try regex (if valid), otherwise fallback to plain substring
              let re = null;
              try {
                re = new RegExp(value, "i");
              } catch (e) {
                re = null;
              }

              return fieldsToCheck.some((f) =>
                this.getValues(item, f).some((val) => {
                  const s = String(val);
                  if (re && re.test(s)) return true;
                  return s.toLowerCase().includes(value.toLowerCase());
                }),
              );
            });
          });
        }
      }

      // Instantiate search engine over the result set. Items keep their URL
      const searchEngine = new SearchEngine(
        Object.entries(window.__RESULT__ || {}).map(([url, attrs]) =>
          Object.assign({ url }, attrs),
        ),
        { defaultFields: ["title", "label", "url", "desc", "description"] },
      );

      // Render prepared tags from the crawl (window.__TAGS__)
      function renderPreparedTags() {
        const container = document.getElementById("search-suggestions");
        container.innerHTML = "";
        const tags = window.__TAGS__ || {};
        const keys = Object.keys(tags).sort();
        if (keys.length === 0) {
          container.style.display = "none";
          return;
        }
        container.style.display = "block";

        for (const k of keys) {
          const info = tags[k] || {};
          const btn = document.createElement("button");
          btn.className = "suggested-tag";
          btn.textContent = k;
          btn.title = `Add tag ${k} to search`;
          btn.style.background = info.color || "#ddd";
          btn.style.border = "none";
          btn.style.padding = "0.25rem 0.5rem";
          btn.style.margin = "0.125rem";
          btn.style.borderRadius = "0.25rem";
          btn.style.cursor = "pointer";
          btn.addEventListener("click", () => {
            const current = searchInput.value?.trim();
            const newQuery = current ? `${current} ${k}` : k;
            setSearchQuery(newQuery);
            searchInput.focus();
          });
          container.appendChild(btn);
        }
      }

      // Initial render of tags
      renderPreparedTags();

      function setSearchQuery(query) {
        state.searchQuery = query;

        if (searchInput.value !== query) {
          searchInput.value = query;
        }

        if (!query) {
          state.suggestions = undefined;
        } else {
          const matches = searchEngine.filter(query);
          state.suggestions = new Set(matches.map((item) => item.url));
        }

        refresh();
        searchClear.dataset.hidden = query?.length ? "false" : "true";
      }

      // =======================
      // Event wiring
      // =======================
      sidebarToggleLeft.addEventListener("click", () => {
        const hidden = sidebarLeft.dataset.hidden === "true";
        setLeftSidebarHidden(!hidden);
      });

      interactiveSelect.addEventListener("change", () => {
        config.interactive = interactiveSelect.value;
        refresh();
      });

      neighboursSelect.addEventListener("change", () => {
        config.neighbours = neighboursSelect.value;

        if (state.hoveredNode) {
          state.hoveredNeighbours = getNodeNeighbours(state.hoveredNode);
        }
        if (state.clickedNode) {
          state.clickedNeighbours = getNodeNeighbours(state.clickedNode);
        }

        refresh();
      });

      greyHideSelect.addEventListener("change", () => {
        config.greyHide = greyHideSelect.value;
        refresh();
      });

      searchInput.addEventListener("input", () => {
        setSearchQuery(searchInput.value || "");
      });

      searchClear.addEventListener("click", () => {
        setSearchQuery("", true);
        searchInput.focus();
      });

      renderer.on("enterNode", ({ node }) =>
        setHoveredNode(nodeIsInteractive(node) ? node : undefined),
      );
      renderer.on("leaveNode", () => setHoveredNode(undefined));
      renderer.on("clickNode", ({ node }) =>
        setClickedNode(nodeIsInteractive(node) ? node : undefined),
      );
      renderer.on("clickStage", () => setClickedNode(undefined));

      // =======================
      // Sigma reducers
      // =======================
      renderer.setSetting("nodeReducer", (node, data) => {
        const res = { ...data };

        if (hasAnySelection() && !nodeIsRelevant(node)) {
          greyOrHideEntity(res);
        }

        if (state.clickedNode === node && !state.hoveredNode) {
          res.highlighted = true;
        }

        return res;
      });

      renderer.setSetting("edgeReducer", (edge, data) => {
        const res = { ...data };

        if (!hasAnySelection()) {
          return res;
        }

        const [source, target] = graph.extremities(edge);

        if (!(nodeIsRelevant(source) && nodeIsRelevant(target))) {
          greyOrHideEntity(res);
        }

        return res;
      });

      // Hide loading
      loading.style.display = "none";
    </script>
  </body>
</html>
